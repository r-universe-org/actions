name: 'Prepare Windows'
description: 'Prepare Windows'
inputs:
  java:
    description: 'Package depends on rJava'
    required: false
  jags:
    description: 'Package depends on JAGS'
    required: false
  quarto:
    description: 'Package depends on Quarto'
    required: false
  cargo:
    description: 'Package depends on Rust'
    required: false

runs:
  using: "composite"
  steps:
    - name: Cache Rtools
      uses: actions/cache@v5
      with:
        path: |
          c:\rtools45-aarch64
        key: ${{ runner.os }}-${{ runner.arch }}
      if: runner.arch == 'arm64'

    - name: Install Rtools on ARM64
      run: |
        if (Test-Path -path "c:\rtools45-aarch64") {
          Write-Output "Found cached c:\rtools45-aarch64"
        } else {
          curl -o rtools45.exe -L https://github.com/r-windows/rtools-chocolatey/releases/download/6768/rtools45-aarch64-6768-6492.exe
          Start-Process "rtools45.exe" -argumentlist "/VERYSILENT /SUPPRESSMSGBOXES" -wait
          Remove-Item rtools45.exe
        }
        "RTOOLS45_AARCH64_HOME=C:\rtools45-aarch64" >> $env:GITHUB_ENV
        "R_PLATFORM_PKGTYPE=windows.binary.clang-aarch64" >> $env:GITHUB_ENV

      shell: pwsh
      if: runner.arch == 'arm64'

    - name: Normalize Rtools
      run: |
        if [ "$RTOOLS46_HOME" ]; then
          echo "Found preinstalled toolchain in $RTOOLS46_HOME"
          echo "RTOOLS45_HOME=$RTOOLS46_HOME" >> $GITHUB_ENV
          echo "RTOOLS44_HOME=$RTOOLS46_HOME" >> $GITHUB_ENV
        elif [ "$RTOOLS45_HOME" ]; then
          echo "Found preinstalled toolchain in $RTOOLS45_HOME"
          echo "RTOOLS46_HOME=$RTOOLS45_HOME" >> $GITHUB_ENV
          echo "RTOOLS44_HOME=$RTOOLS45_HOME" >> $GITHUB_ENV
        fi
        #if [ "$UNIVERSE_NAME" = "cran" ] || [ "$UNIVERSE_NAME" = "bioc" ]; then
        #  echo "_R_INSTALL_TIME_PATCHES_=https://www.r-project.org/nosvn/winutf8/ucrt3/" >> $GITHUB_ENV
        #fi
      shell: bash
      if: runner.arch != 'arm64'

    - name: Set some variables
      shell: bash
      run: |
        if [[ "${{runner.arch}}" == "ARM64" ]]; then
          echo "JAVA_HOME=$JAVA_HOME_21_AARCH64" >> $GITHUB_ENV
        else
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> $GITHUB_ENV
        fi
        
        # Sources: https://github.com/r-universe-org/patches
        # Format: https://www.r-project.org/nosvn/winutf8/ucrt3/patches_aarch64/
        if [ "$UNIVERSE_NAME" = "cran" ] || [ "$UNIVERSE_NAME" = "bioc" ] || [ "$UNIVERSE_NAME" = "bioc-release" ]; then
          echo "_R_INSTALL_TIME_PATCHES_=http://patches.r-universe.dev" >> $GITHUB_ENV
        fi

    - name: "Shim Rust / Cargo on WINARM"
      run: |
        rustup target add aarch64-pc-windows-gnullvm || true
        echo "HOST_CARGO=$(which cargo)" >> $GITHUB_ENV
        echo "CARGO_BUILD_TARGET=aarch64-pc-windows-gnullvm" >> $GITHUB_ENV
        echo "${GITHUB_ACTION_PATH}/shims" >> $GITHUB_PATH

      shell: bash
      if: inputs.cargo && runner.arch == 'arm64'

    - name: "Install JAGS if needed"
      run: |
        if ("${{runner.arch}}" -eq "ARM64") {
            $url = "https://github.com/r-universe-org/actions/releases/download/JAGS-4.3.2/JAGS-4.3.2-aarch64.exe"
        } else {
            $url = "https://github.com/r-universe-org/actions/releases/download/JAGS-4.3.1/JAGS-4.3.1.exe"
        }
        $jags = Join-Path $env:RUNNER_TEMP 'JAGS.exe'
        curl.exe -sSL -o $jags $url
        Start-Process $jags -ArgumentList '/S','/AllUsers' -Wait
        $dir = Get-ChildItem 'C:\Program Files\JAGS\JAGS-*' | Select-Object -First 1
        if (-not $dir) { throw 'JAGS did not install' }
        $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($dir.FullName).ShortPath
        Write-Host "Setting JAGS_ROOT=$short"
        "JAGS_ROOT=$short" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        "JAGS_HOME=$short" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      shell: pwsh
      if: inputs.jags

    - name: "Install Pandoc"
      run: |
        curl -sSLo pandoc.zip -sSL https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-windows-x86_64.zip
        unzip pandoc.zip
        cp -vf "pandoc-3.9/pandoc.exe" "/c/windows/"
        rm -Rf pandoc*
      shell: bash
      continue-on-error: true

    - name: "Install Quarto"
      run: choco install -y --no-progress quarto
      shell: pwsh
      if: inputs.quarto
      continue-on-error: true

    - name: Get source package
      uses: actions/download-artifact@v8
      with:
        name: package-source
        path: .

# Adds a preinstalled (cached) python version to the path
    - name: Set python version
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

name: 'Build package'
description: 'Prepare and build package'
inputs:
  sourcepkg:
    description: 'File of the source package'
    required: true

runs:
  using: "composite"
  steps:
      ## NOTE: ${{github.action_path}} does not work within container script, we need $GITHUB_ACTION_PATH
    - name: Build the package
      shell: bash
      run: R CMD INSTALL ${{inputs.sourcepkg}} --library=mylib --build 2>&1 | tee install.log
      env:
        R_ENVIRON_USER: ${{github.action_path}}/../check.Renviron

inputs:
  r-version:
    required: false
    default: release

runs:
  using: "composite"
  steps: 
    - shell: bash
      if: runner.os == 'macos' && runner.arch == 'arm64'
      run: |
        version="${{inputs.r-version}}"
        if [ "$version" = "devel" ]; then
          URL="https://github.com/r-universe-org/actions/releases/download/4.6.1/R-4.6.1-arm64.pkg"
        elif [ "$version" = "release" ]; then
          URL="https://github.com/r-universe-org/actions/releases/download/4.6.1/R-4.6.1-arm64.pkg"
        elif [ "$version" = "oldrel" ]; then
          URL="https://github.com/r-universe-org/actions/releases/download/4.5.3/R-4.5.3-arm64.pkg"
        fi
        echo "Installing from $URL"
        PKG=$(basename $URL)
        curl --max-time 300 --retry 3 --fail-with-body -sSLO $URL
        sudo installer -pkg "$PKG" -target /
        rm -f $PKG

    - shell: bash
      if: runner.os == 'macos' && runner.arch != 'arm64'
      run: |
        version="${{inputs.r-version}}"
        if [ "$version" = "devel" ]; then
          URL="https://github.com/r-universe-org/actions/releases/download/4.6.1/R-4.6.1-x86_64.pkg"
        elif [ "$version" = "release" ]; then
          URL="https://github.com/r-universe-org/actions/releases/download/4.6.1/R-4.6.1-x86_64.pkg"
        elif [ "$version" = "oldrel" ]; then
          URL="https://github.com/r-universe-org/actions/releases/download/4.5.3/R-4.5.3-x86_64.pkg"
        fi
        echo "Installing from $URL"
        PKG=$(basename $URL)
        curl --max-time 300 --retry 3 --fail-with-body -sSLO $URL
        sudo installer -pkg "$PKG" -target /
        rm -f $PKG

    - shell: pwsh
      if: runner.os == 'windows' && runner.arch != 'arm64'
      run: |
        $version = "${{inputs.r-version}}"
        if ( $version -eq "devel" ) {
          $URL = "https://cloud.r-project.org/bin/windows/base/R-devel-win.exe"
        } elseif ( $version -eq "release" ) {
          $URL = "https://github.com/r-universe-org/actions/releases/download/4.6.1/R-4.6.1-win.exe"
        } elseif ( $version -eq "oldrel" ) {
          $URL = "https://github.com/r-universe-org/actions/releases/download/4.5.3/R-4.5.3-win.exe"
        }
        curl -o Rinstall.exe --max-time 300 --retry 3 --fail-with-body --ssl-no-revoke -sSL $URL
        echo "Starting R installer..."
        Start-Process "Rinstall.exe" -argumentlist "/VERYSILENT /SUPPRESSMSGBOXES /DIR=C:\\R" -wait
        echo "Done!"
        Remove-Item Rinstall.exe
        echo "C:\\R\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - shell: pwsh
      if: runner.os == 'windows' && runner.arch == 'arm64'
      run: |
        $version = "${{inputs.r-version}}"
        if ( $version -eq "devel" ) {
          $URL = "https://github.com/r-devel/actions/releases/download/devel/R-devel-aarch64.exe"
        } elseif ( $version -eq "release" ) {
          $URL = "https://github.com/r-devel/actions/releases/download/4.6.1/R-4.6.1-aarch64.exe"
        }
        curl -o Rinstall.exe --max-time 300 --retry 3 --fail-with-body --ssl-no-revoke -sSL $URL
        echo "Starting R installer..."
        Start-Process "Rinstall.exe" -argumentlist "/VERYSILENT /SUPPRESSMSGBOXES /DIR=C:\\R" -wait
        echo "Done!"
        Remove-Item Rinstall.exe
        echo "C:\\R\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - shell: bash
      run: R --version

    - name: Start Xvfb and rJava
      shell: bash
      if: runner.os == 'macos'
      continue-on-error: true
      run: |
        echo '::group::Start Xvfb and rJava'
        sudo nohup /opt/X11/bin/Xvfb :6 -screen 0 1280x1024x24 > ~/X.log &
        export DISPLAY=:6
        echo "Started Xvfb server on $DISPLAY"
        echo "DISPLAY=$DISPLAY" >> $GITHUB_ENV
        if [ "$(uname -m)" = "arm64" ]; then
          echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> $GITHUB_ENV
        else
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> $GITHUB_ENV
        fi
        R CMD javareconf || true
        echo "::endgroup::"

    - name: Set Windows timezone
      if: runner.os == 'windows'
      run: |
        tzutil /g
        tzutil /s "GMT Standard Time"
        tzutil /g
      shell: pwsh
